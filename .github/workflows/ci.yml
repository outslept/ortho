name: ci

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # build.rs uses winresource: MSVC needs rc.exe (Windows SDK, already on
      # the runner); GNU needs windres.exe + ar.exe from MinGW-w64 in PATH.
      - name: Setup MinGW-w64 (GNU only)
        id: msys2
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Put MinGW-w64 on PATH (GNU only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup component add rustfmt clippy --toolchain stable
          rustup target add ${{ matrix.target }} --toolchain stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Format
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Tests
        run: cargo test --target ${{ matrix.target }}

      - name: Release build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orthowm-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/orthowm.exe
          if-no-files-found: error
