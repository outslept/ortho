[package]
name = "orthowm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast rectangle-style window manager for Windows 10 and 11"
license = "MIT"
repository = "https://github.com/outslept/ortho"
readme = "README.md"
keywords = ["window-manager", "tiling", "win32", "windows"]
categories = ["os::windows-apis"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
lto = true
codegen-units = 1
